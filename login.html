<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nusantara Journal of Economics and Business</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="journal-header">
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="NJEB Logo" class="journal-logo">
            </div>
            <div class="title-section">
                <h1>NUSANTARA JOURNAL OF ECONOMICS AND BUSINESS</h1>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="login.html">LOGIN</a></li>
            <li><a href="register.html">REGISTER</a></li>
            <li><a href="index.html">HOME</a></li>
            <li><a href="issue.html">CURRENT</a></li>
            <li><a href="archives.html">ARCHIVES</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="editorial.html">PEOPLE</a></li>
        </ul>
    </nav>

    <div class="container">
        
        <main class="main-content" style="flex: 1;">
            
            <div class="breadcrumb">
                <a href="index.html">HOME</a> / <span>Login</span>
            </div>

            <h2 class="page-title">Login</h2>
            
            <p class="form-instruction">Required fields are marked with an asterisk: <span>*</span></p>

            <div class="login-form-container">
                <form action="#" method="POST" class="ojs-form">
                    
                    <div class="form-group">
                        <label for="username"><i>Username</i> <span>*</span></label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password"><i>Password</i> <span>*</span></label>
                        <input type="password" id="password" name="password" required>
                        <a href="#" class="forgot-password">Forgot your password?</a>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Keep me logged in</label>
                    </div>

                    <div class="form-actions">
                        <a href="register.html" class="register-link">Register</a>
                        <button type="submit" class="btn-login">Login</button>
                    </div>

                </form>
            </div>

        </main>

    </div>

    <footer class="journal-footer">
        <p>&copy; 2022 Nusantara Journal of Economics and Business</p>
    </footer>

</body>
</html>
